name: Regressão

on:
  workflow_dispatch:

jobs:
  regressao:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: regressao
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: regressao/package-lock.json
      - run: npm ci
      - run: npm test
